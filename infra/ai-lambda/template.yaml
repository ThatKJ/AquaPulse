AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AquaPulse AI endpoint: one Lambda (Node 22) behind a Function URL. It runs Bedrock Converse with a
  Rekognition DetectLabels fallback. Callers must send the shared secret in x-aquapulse-secret.

Parameters:
  EndpointSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Shared secret the web host sends as x-aquapulse-secret (AI_ENDPOINT_SECRET).
  BedrockModelId:
    Type: String
    Default: ""
    Description: Bedrock model or inference-profile id from `npm run verify:bedrock`. Blank = Rekognition only.
  ReservedConcurrency:
    Type: Number
    Default: 2
    Description: >
      Cap on concurrent executions (cost and abuse guard). Use -1 for no reservation: accounts whose
      total concurrency limit is 10 cannot reserve any.

  IngestUrl:
    Type: String
    Default: ""
    Description: >
      Full URL of the web app's scheduled-ingest route (…/api/ingest/national). Blank = no schedule is created.
  IngestSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: The web app's WEBHOOK_SECRET, sent as x-aquapulse-secret by the scheduled tick.
  IngestRateMinutes:
    Type: Number
    Default: 15
    MinValue: 10
    Description: Minutes between national feed refreshes.

Conditions:
  HasIngest: !Not [!Equals [!Ref IngestUrl, ""]]
  HasModel: !Not [!Equals [!Ref BedrockModelId, ""]]
  Reserve: !Not [!Equals [!Ref ReservedConcurrency, -1]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-fn"
      RetentionInDays: 14

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: aquapulse-ai
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Granted only when a Bedrock model is configured; a Rekognition-only deploy has no Bedrock permission.
              - !If
                - HasModel
                - Sid: Converse
                  Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource:
                    # Cross-region inference profiles route to foundation models in other regions.
                    - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                    - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
                - !Ref "AWS::NoValue"
              - Sid: Labels
                Effect: Allow
                Action: rekognition:DetectLabels
                Resource: "*" # DetectLabels has no resource-level permissions
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fn"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt Role.Arn
      Timeout: 60
      MemorySize: 512
      ReservedConcurrentExecutions: !If [Reserve, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          AI_ENDPOINT_SECRET: !Ref EndpointSecret
          BEDROCK_MODEL_ID: !If [HasModel, !Ref BedrockModelId, !Ref "AWS::NoValue"]
          INGEST_URL: !If [HasIngest, !Ref IngestUrl, !Ref "AWS::NoValue"]
          INGEST_SECRET: !If [HasIngest, !Ref IngestSecret, !Ref "AWS::NoValue"]
      Code:
        # Placeholder so the stack needs no S3 bucket. deploy.sh uploads the real bundle with update-function-code.
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ requestId: "placeholder", error: { code: "NOT_DEPLOYED", message: "Code not uploaded yet; run infra/ai-lambda/deploy.sh." } }),
          });

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE # the handler enforces the shared secret; the web host has no AWS identity to sign with

  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Function URLs created since October 2025 also need lambda:InvokeFunction scoped to URL invocations.
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Unattended refresh of the national feeds: EventBridge Scheduler invokes the function with a marker event,
  # and the function calls the web app's secret-protected ingest route. The app's single-flight lock makes
  # overlapping or retried ticks harmless.
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: HasIngest
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: invoke-ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Function.Arn

  IngestSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasIngest
    Properties:
      Name: !Sub "${AWS::StackName}-national-ingest"
      Description: Refresh AquaPulse national feeds (NDMA SACHET, IMD nowcast).
      ScheduleExpression: !Sub "rate(${IngestRateMinutes} minutes)"
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source":"aquapulse.scheduler"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 600

Outputs:
  FunctionName:
    Value: !Ref Function
  AiEndpointUrl:
    Description: Set as AI_ENDPOINT_URL on the web host.
    Value: !GetAtt Url.FunctionUrl
